<div class="card mb-3">
    <div class="card-header">
        <h2>{{ title }}</h2>
    </div>
    <div class="card-body">
        <h5 class="card-title">{{author}}</h5>
        <p class="card-text my-1">Рік видання: {{year}}</p>
        <p class="card-text">Жанр: {{genre}}</p>
        <div class="d-flex justify-content-end">
            <button class="btn btn-sm btn-warning mx-1">Edit</button>
            <button class="btn btn-sm btn-danger mx-1">Delete</button>
        </div>
    </div>
</div>
